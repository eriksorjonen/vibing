name: Deploy Evidence to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-bi-report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-bi-report/package-lock.json

      - name: Install Evidence dependencies
        run: npm ci

      - name: Restore Evidence source data
        run: |
          mkdir -p .evidence/template/static/data
          cp -R deploy-data/. .evidence/template/static/data/

      - name: Set GitHub Pages base path
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"].split("/")[-1]
          base_path = "" if repo.endswith(".github.io") else f"/{repo}"

          path = Path("evidence.config.yaml")
          lines = path.read_text().splitlines()
          output = []
          replaced = False
          skipping_deployment = False

          for line in lines:
              if line.startswith("deployment:"):
                  output.append("deployment:")
                  output.append(f"  basePath: '{base_path}'")
                  replaced = True
                  skipping_deployment = True
                  continue

              if skipping_deployment:
                  if line.startswith(" ") or line == "":
                      continue
                  skipping_deployment = False

              output.append(line)

          if not replaced:
              output.append("")
              output.append("deployment:")
              output.append(f"  basePath: '{base_path}'")

          path.write_text("\n".join(output) + "\n")
          print(f"Evidence base path set to: {base_path or '/'}")
          PY

      - name: Build Evidence site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-bi-report/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
