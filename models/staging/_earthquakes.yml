version: 2

models:
  - name: stg_earthquakes
    description: "Cleaned USGS earthquake events from the last 30 days."
    columns:
      - name: event_id
        description: "USGS event identifier."
        data_tests:
          - unique
          - not_null
      - name: occurred_at
        description: "UTC timestamp of the earthquake event."
        data_tests:
          - not_null
      - name: magnitude
        description: "Reported earthquake magnitude."
        data_tests:
          - not_null
      - name: place
        description: "Human-readable location description."
