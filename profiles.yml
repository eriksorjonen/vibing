dbt_duckdb:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_DEV_PATH', 'data/dev.duckdb') }}"
      schema: main
      threads: 4

    prod:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PROD_PATH', 'data/prod.duckdb') }}"
      schema: main
      threads: 4

    ci:
      type: duckdb
      path: ":memory:"
      schema: main
      threads: 1
